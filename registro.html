<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="./css/registro.css">
</head>
<body>
<section class="registro-section">
    <div class="registro-box">
        <img src="./img/logo.png" alt="logo">
        <h2>Regístrate para empezar a escuchar contenido</h2>
        <form>
            <div class="input-group">
                <label>Nombre completo</label>
                <input type="text" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" placeholder="Crea un usuario" required>
            </div>
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" placeholder="Ingresa tu correo" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" placeholder="Crea una contraseña" required>
            </div>
            <div class="input-group">
                <label>Confirmar contraseña</label>
                <input type="password" placeholder="Confirma tu contraseña" required>
            </div>
            <button type="submit" class="btn-registro-main">Crear cuenta</button>
        </form>
        <p class="login-link">
            ¿Ya tienes cuenta?
            <a href="login.html">Inicia sesión</a>
        </p>
    </div>
</section>
</body>
</html>
